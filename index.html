<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Garra de Águia – Flash Cards</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Spectral:ital,wght@0,400;0,600;0,800;1,400&display=swap">
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<style>
:root{--ink:#120d0b;--panel:#1d1512;--line:#4a3426;--red:#b3261e;--red2:#d8392c;--gold:#e0b45a;--paper:#f3e6cf;--mute:#a8957b;--ok:#3f9b5f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#2a1a14 0%,var(--ink) 65%);color:var(--paper);font-family:Spectral,Georgia,serif;display:flex;flex-direction:column;overflow-x:hidden}
.cn{font-family:"Ma Shan Zheng","Noto Serif SC","Songti SC",serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 4vw}
.brand{display:flex;align-items:center;gap:14px;font-size:clamp(18px,2vw,26px);font-weight:600}
.seal{width:52px;height:52px;background:var(--red);color:var(--paper);display:grid;place-items:center;font-size:34px;border-radius:6px;transform:rotate(-4deg);box-shadow:inset 0 0 0 3px #00000040}
nav{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.tab,.chip{background:transparent;border:1.5px solid var(--line);color:var(--mute);padding:10px 20px;border-radius:999px;font-size:clamp(15px,1.3vw,20px)}
.tab[aria-pressed=true],.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:800}
.tab:hover,.chip:hover{border-color:var(--gold)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 4vw 24px;min-height:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.sep{width:1px;background:var(--line);margin:0 6px}
.stage{flex:1;width:min(1200px,100%);min-height:360px;perspective:1800px;display:flex}
.card{position:relative;flex:1;border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 5vw;border:2px solid var(--gold);background:linear-gradient(160deg,#241813,var(--panel));box-shadow:0 30px 60px #0009, inset 0 0 0 8px var(--ink), inset 0 0 0 10px var(--line)}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,#3a1511,#22100d);border-color:var(--red2)}
.tag{position:absolute;top:28px;left:34px;color:var(--mute);font-size:clamp(14px,1.3vw,20px);font-style:italic}
.hint{position:absolute;bottom:26px;color:var(--mute);font-size:clamp(14px,1.2vw,19px);font-style:italic}
.big{font-weight:800;line-height:1.05;font-size:clamp(44px,8vw,120px);color:var(--paper);letter-spacing:.01em}
.han{font-size:clamp(60px,10vw,150px);line-height:1;color:var(--gold);margin-bottom:.1em}
.pron{font-size:clamp(24px,3vw,44px);color:var(--gold);font-style:italic;margin-top:.4em}
.mean{font-size:clamp(34px,5.4vw,84px);font-weight:800;line-height:1.1}
.desc{font-size:clamp(20px,2.3vw,34px);line-height:1.4;max-width:30em;margin-top:.7em;color:var(--paper)}
.sub{font-size:clamp(20px,2.2vw,32px);color:var(--gold);margin-top:.5em}
.bar{display:flex;align-items:center;gap:20px;margin-top:18px}
.nav{background:var(--red);border:0;color:var(--paper);width:clamp(56px,5vw,76px);height:clamp(56px,5vw,76px);border-radius:50%;font-size:clamp(26px,2.6vw,38px)}
.nav:hover{background:var(--red2)}
.count{min-width:120px;text-align:center;font-size:clamp(20px,2vw,30px);color:var(--mute)}
.prog{width:min(1200px,100%);height:6px;background:var(--line);border-radius:3px;margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transition:width .4s}
/* quiz */
.quiz{width:min(1100px,100%);flex:1;display:flex;flex-direction:column;justify-content:center;gap:3vh}
.qn{color:var(--gold);font-size:clamp(18px,1.8vw,26px)}
.q{font-size:clamp(28px,3.6vw,56px);font-weight:600;line-height:1.2;margin:0}
.opts{display:grid;gap:14px}
.opt{display:flex;align-items:center;gap:22px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:clamp(14px,2.4vh,26px) 26px;font-size:clamp(22px,2.6vw,40px);line-height:1.25}
.opt b{flex:none;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--gold);font-size:.8em}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt:disabled{cursor:default}
.opt.ok{background:#16301f;border-color:var(--ok)}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{background:#3a1511;border-color:var(--red2)}.opt.no b{background:var(--red2);color:#fff}
.opt.dim{opacity:.45}
.say{min-height:3.2em;font-size:clamp(20px,2.3vw,34px);font-style:italic;color:var(--gold);line-height:1.35}
.qbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn{background:var(--red);border:0;color:var(--paper);padding:14px 32px;border-radius:999px;font-size:clamp(18px,1.8vw,26px);font-weight:600}
.btn:hover{background:var(--red2)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--mute)}
.end{text-align:center}
.end .han{font-size:clamp(80px,14vw,200px)}
footer{text-align:center;color:var(--mute);font-size:14px;padding:0 4vw 14px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){.card,.prog i{transition:none}}
@media (max-width:640px){.sep{display:none}.tag{left:20px;top:18px}}
.rem{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);right:4vw;z-index:5;background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:18px 22px;max-width:360px;font-size:17px;line-height:1.4;box-shadow:0 20px 40px #000a}
.rem p{margin:.5em 0}.code{font-size:60px;font-weight:800;color:var(--gold);letter-spacing:.14em;line-height:1.1}
.st{font-size:16px;color:var(--mute);margin:.3em 0}.st.on{color:var(--ok)}
#mCtl{width:100%;max-width:560px;margin:0 auto;padding:0 16px 24px}
.ctl{display:grid;gap:12px}.row{display:flex;gap:10px}.row>*{flex:1}
.cb{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px 12px;font-size:19px;text-align:center}
.cb.on{border-color:var(--gold);color:var(--gold)}.cb.ok{border-color:var(--ok);background:#16301f}
.cb.big{background:var(--red);border-color:var(--red);font-size:26px;font-weight:800;padding:30px 12px}
.cb[disabled]{opacity:.45}.cb.opt2{text-align:left}
.peek{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:16px;line-height:1.35}
.pk1{font-size:28px;font-weight:800}.pk2{font-size:22px;color:var(--gold);font-weight:600}
#ci{font:inherit;font-size:36px;text-align:center;letter-spacing:.2em;padding:14px;border-radius:12px;border:2px solid var(--gold);background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="seal cn" aria-hidden="true">鷹</div><span>Kung Fu Garra de Águia</span></div>
  <nav aria-label="Modo">
    <button class="tab" id="tCards" aria-pressed="true">Flash cards</button>
    <button class="tab" id="tQuiz" aria-pressed="false">Quiz da plateia</button>
    <button class="tab" id="tRem" aria-pressed="false">Controle remoto</button>
  </nav>
</header>

<main id="mCards">
  <div class="tools">
    <button class="chip" data-f="all" aria-pressed="true">Tudo (13)</button>
    <button class="chip" data-f="p" aria-pressed="false">10 princípios</button>
    <button class="chip" data-f="f" aria-pressed="false">3 formas</button>
    <span class="sep"></span>
    <button class="chip" id="dir" aria-pressed="false">Cantonês → Português</button>
    <button class="chip" id="shuf" aria-pressed="false">Embaralhar</button>
  </div>
  <div class="stage"><button class="card" id="card" aria-label="Virar carta"></button></div>
  <div class="prog"><i id="prog"></i></div>
  <div class="bar">
    <button class="nav" id="prev" aria-label="Anterior">‹</button>
    <div class="count" id="count"></div>
    <button class="nav" id="next" aria-label="Próxima">›</button>
  </div>
</main>

<main id="mQuiz" class="hidden">
  <div class="quiz" id="quiz"></div>
</main>
<main id="mCtl" class="hidden"><div class="ctl" id="ctl"></div></main>
<div class="rem hidden" id="rempanel"><b>Controle pelo celular</b>
<p>No celular, acesse este mesmo site, toque em “Controle remoto” e depois em “Usar este aparelho como controle”. Digite o código:</p>
<div class="code" id="rcode"></div><div class="st" id="rst">Conectando…</div>
<button class="chip" id="asctl">Usar este aparelho como controle</button></div>
<footer id="foot">Espaço vira a carta · ← → navegam · S embaralha · D troca o idioma da frente</footer>

<script>
const D=[
{t:'p',c:'JAU',p:'Jau',m:'Agarrar ou prender'},
{t:'p',c:'DA',p:'Da',m:'Golpear ou arremessar'},
{t:'p',c:'KUM',p:'Kum',m:'Capturar ou pegar'},
{t:'p',c:'NA',p:'Ná',m:'Imobilizar ou estrangular'},
{t:'p',c:'FAN GUN',p:'Fán Guên (ou Fán Guún)',m:'Separar os tendões ou veias'},
{t:'p',c:'CHO GWAT',p:'Tchô Guát',m:'Deslocar articulações'},
{t:'p',c:'DIM YUET',p:'Dím Yuêt',m:'Golpear precisamente os pontos de pressão'},
{t:'p',c:'BAAI HEI',p:'Bái Hêi',m:'Parar a respiração'},
{t:'p',c:'SIM GIN',p:'Sím Djín',m:'Esquivar'},
{t:'p',c:'TUN NOH',p:'Tún Nô',m:'Saltar e conduzir usando a força do adversário'},
{t:'f',c:'HAHNG KUNE SAHP LO',p:'Ráng Cún Sáp Lô',m:'Punhos dos 10 Caminhos',d:'A forma matriz e primal. Organiza socos, chutes, esquivas (Sim Gin) e bloqueios em 10 fileiras retas e constrói a base, a postura e a estrutura física.'},
{t:'f',c:'LIN KUNE NG SAHP LO',p:'Lín Cún Úm Sáp Lô',m:'50 Seções de Punhos Combinados',d:'Cinquenta sequências contínuas para os dois lados do corpo. Conecta ataque (Da), captura (Kum) e saltos (Tun Noh) em ritmo, fluidez e explosão.'},
{t:'f',c:'108 CHIN NA',p:'Iá Líng Pá Tchín Ná',m:'108 Técnicas de Chaves',d:'Forma praticada em dupla (Duilian). Aplicação pura dos princípios: a garra (Jau) torce articulações (Cho Gwat), separa tendões (Fan Gun) e atinge pontos vitais (Dim Yuet).'}
];
const Q=[
{q:'Qual é o grupo de 4 palavras em cantonês que resume as ações de agarrar, golpear, capturar e imobilizar no Garra de Águia?',o:['Sim Gin, Tun Noh, Fan Gun, Cho Gwat','Jau, Da, Kum, Na','Hahng Kune, Lin Kune, Chin Na, Wude'],a:1,s:'Perfeito! Jau (agarrar), Da (golpear), Kum (capturar) e Na (imobilizar) formam os quatro pilares básicos de ação do nosso estilo.'},
{q:'Qual é a forma matriz do Garra de Águia que organiza socos, chutes e bloqueios em 10 fileiras retas para construir a base e a postura do praticante?',o:['Lin Kune Ng Sahp Lo','108 Chin Na','Hahng Kune Sahp Lo'],a:2,s:'Exatamente! Hahng Kune Sahp Lo significa “Punhos dos 10 Caminhos” e é a forma matriz inicial.'},
{q:'Qual das 3 formas é praticada obrigatoriamente em dupla (Duilian) e foca em chaves, torções articulares e imobilizações?',o:['108 Chin Na','Lin Kune Ng Sahp Lo','Hahng Kune Sahp Lo'],a:0,s:'Correto! O 108 Chin Na reúne as 108 técnicas de imobilização e chaves executadas em dupla.'},
{q:'Para fechar! O que significa o nome da forma Lin Kune Ng Sahp Lo?',o:['108 Técnicas de Chaves','50 Seções de Punhos Combinados','Punhos dos 10 Caminhos'],a:1,s:'Excelente! “Ng Sahp” é 50 em cantonês, representando as 50 Seções de Punhos Combinados organizadas para dar fluidez ao praticante.'}
];
const $=s=>document.querySelector(s);
let filt='all',rev=false,deck=[...D],i=0,flipped=false;
const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const cn=x=>`<div class="big">${x.c}</div>${x.h?`<div class="han cn" style="margin-top:.2em">${x.h}</div>`:''}<div class="pron">“${x.p}”</div>`;
const pt=x=>`<div class="mean">${x.m}</div>${x.d?`<div class="desc">${x.d}</div>`:''}`;
function render(){
  const x=deck[i],kind=x.t==='p'?'Princípio':'Forma (Taolu)';
  const front=rev?pt(x):cn(x),back=rev?cn(x):pt(x);
  $('#card').innerHTML=`<div class="face front"><span class="tag">${kind}</span>${front}<span class="hint">toque ou espaço para virar</span></div><div class="face back"><span class="tag">${kind}</span>${back}</div>`;
  $('#card').classList.toggle('flip',flipped);
  $('#count').textContent=`${i+1} / ${deck.length}`;
  $('#prog').style.width=((i+1)/deck.length*100)+'%';
}
function build(keep){
  const base=D.filter(x=>filt==='all'||x.t===filt);
  deck=keep?shuffle(base):base;i=0;flipped=false;render();
}
function go(n){i=(i+n+deck.length)%deck.length;flipped=false;render()}
$('#card').onclick=()=>{flipped=!flipped;$('#card').classList.toggle('flip',flipped)};
$('#next').onclick=()=>go(1);$('#prev').onclick=()=>go(-1);
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-f]').forEach(c=>c.setAttribute('aria-pressed',c===b));
  filt=b.dataset.f;build($('#shuf').getAttribute('aria-pressed')==='true')});
function toggleDir(){rev=!rev;$('#dir').setAttribute('aria-pressed',rev);$('#dir').textContent=rev?'Português → Cantonês':'Cantonês → Português';flipped=false;render()}
$('#dir').onclick=toggleDir;
function toggleShuf(){const b=$('#shuf'),on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);build(on)}
$('#shuf').onclick=toggleShuf;

/* quiz */
let qi=0,score=0,answered=false;
function showQ(){
  const q=Q[qi];answered=false;
  $('#quiz').innerHTML=`<div class="qn">Pergunta ${qi+1} de ${Q.length}</div><h2 class="q">${q.q}</h2>
  <div class="opts">${q.o.map((t,k)=>`<button class="opt" data-k="${k}"><b>${'ABC'[k]}</b><span>${t}</span></button>`).join('')}</div>
  <div class="say" id="say" aria-live="polite"></div>
  <div class="qbar"><button class="btn hidden" id="qn">${qi<Q.length-1?'Próxima pergunta':'Ver resultado'}</button><button class="btn ghost" id="qr">Reiniciar quiz</button></div>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  $('#qn').onclick=()=>{qi++;qi<Q.length?showQ():endQ()};
  $('#qr').onclick=resetQ;
}
function pick(k){
  if(answered)return;answered=true;const q=Q[qi];
  document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;
    if(n===q.a)b.classList.add('ok');else if(n===k)b.classList.add('no');else b.classList.add('dim')});
  if(k===q.a){score++;$('#say').textContent=q.s}
  else $('#say').textContent='Quase! A resposta certa é a alternativa '+'ABC'[q.a]+'. '+q.s.replace(/^[^!]*!\s*/,'');
  $('#qn').classList.remove('hidden');$('#qn').focus();
}
function endQ(){
  $('#quiz').innerHTML=`<div class="end"><div class="han cn">鷹爪</div><h2 class="q">Resultado: ${score} de ${Q.length}</h2><p class="say">${score===Q.length?'Garra firme! Todas corretas.':'Boa! Continue treinando os fundamentos.'}</p><div class="qbar" style="justify-content:center"><button class="btn" id="qr">Jogar de novo</button></div></div>`;
  $('#qr').onclick=resetQ;
}
function resetQ(){qi=0;score=0;showQ()}

function mode(m){
  const c=m==='c';
  $('#mCards').classList.toggle('hidden',!c);$('#mQuiz').classList.toggle('hidden',c);
  $('#tCards').setAttribute('aria-pressed',c);$('#tQuiz').setAttribute('aria-pressed',!c);
  $('#foot').textContent=c?'Espaço vira a carta · ← → navegam · S embaralha · D troca o idioma da frente':'Clique numa alternativa ou tecle A, B, C · Enter avança';
  if(!c&&!$('#quiz').innerHTML)resetQ();
}
$('#tCards').onclick=()=>mode('c');$('#tQuiz').onclick=()=>mode('q');
document.addEventListener('keydown',e=>{
  const quiz=!$('#mQuiz').classList.contains('hidden');
  if(quiz){const k='abc'.indexOf(e.key.toLowerCase());if(k>=0&&document.querySelectorAll('.opt').length)pick(k);
    if(e.key==='Enter'&&answered&&$('#qn')&&document.activeElement.id!=='qn')$('#qn').click();return}
  if(e.key===' '){e.preventDefault();$('#card').click()}
  else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key.toLowerCase()==='s')toggleShuf();else if(e.key.toLowerCase()==='d')toggleDir();
});
build(false);

/* controle remoto (sala em tempo real) via PeerJS */
const WL=['flip','next','prev','shuf','dir','filt','mode','pick','qnext','qreset'];
let peer=null,conns=[],connCtl=null,ST=null,last='',tm=0,ctlCode='';
try{ctlCode=localStorage.getItem('gcode2')||''}catch(e){}
let code='';try{code=localStorage.getItem('gcode')||''}catch(e){}
if(!code){code=String(1000+Math.floor(Math.random()*9000));try{localStorage.setItem('gcode',code)}catch(e){}}
$('#rcode').textContent=code;
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function act(a,v){
  if(!WL.includes(a))return;
  const quiz=!$('#mQuiz').classList.contains('hidden');
  if(a==='flip'&&!quiz)$('#card').click();
  else if(a==='next'&&!quiz)go(1);else if(a==='prev'&&!quiz)go(-1);
  else if(a==='shuf')toggleShuf();else if(a==='dir')toggleDir();
  else if(a==='filt'&&['all','p','f'].includes(v))document.querySelector(`[data-f="${v}"]`).click();
  else if(a==='mode'&&(v==='c'||v==='q'))mode(v);
  else if(a==='pick'&&quiz&&Q[qi]&&[0,1,2].includes(v))pick(v);
  else if(a==='qnext'&&quiz){const b=$('#qn');if(b&&!b.classList.contains('hidden'))b.click()}
  else if(a==='qreset'&&quiz)resetQ();
}
function snap(){
  const q=!$('#mQuiz').classList.contains('hidden'),x=deck[i]||{},s={mode:q?'q':'c'};
  if(!q)Object.assign(s,{i:i+1,n:deck.length,fl:flipped,rev,filt,sh:$('#shuf').getAttribute('aria-pressed')==='true',c:x.c,m:x.m,d:x.d});
  else if(qi>=Q.length)Object.assign(s,{done:1,score,qn:Q.length});
  else Object.assign(s,{qi,qn:Q.length,q:Q[qi].q,o:Q[qi].o,a:Q[qi].a,ans:answered});
  return s}
function pub(){
  const s=snap(),j=JSON.stringify(s);
  if(j!==last){
    last=j;
    conns.forEach(c=>c.send({type:'st',st:s}));
  }
}
function startDisplay(){
  const st=$('#rst');
  peer=new Peer('garra-'+code);
  peer.on('open',()=>st.textContent='Aguardando o celular…');
  peer.on('connection',c=>{
    conns.push(c);
    c.on('data',d=>{if(d.type==='cmd')act(d.a,d.v)});
    c.on('close',()=>{
      conns=conns.filter(x=>x!==c);
      st.textContent=conns.length?'Celular conectado ✓':'Aguardando o celular…';
      st.classList.toggle('on',conns.length>0);
    });
    st.textContent='Celular conectado ✓';
    st.classList.add('on');
    last='';pub();
  });
  peer.on('error',()=>st.textContent='Erro de conexão. Recarregue a página.');
  tm=setInterval(pub,500);
}
$('#tRem').onclick=()=>{const h=$('#rempanel').classList.toggle('hidden');$('#tRem').setAttribute('aria-pressed',!h)};
function drawCtl(){
  const el=$('#ctl'),s=ST;
  if(!connCtl){el.innerHTML=`<div class="peek"><div class="pk1">Controle remoto</div><div class="st">Digite o código que aparece no telão.</div></div><input id="ci" inputmode="numeric" maxlength="4" placeholder="0000" value="${esc(ctlCode)}"><button class="cb big" id="cgo">Conectar</button><div class="st" id="cmsg"></div>`;$('#cgo').onclick=connectCtl;return}
  if(!s){el.innerHTML='<div class="st">Conectado à sala. Aguardando o telão…</div>';return}
  let h=`<div class="row"><button class="cb ${s.mode==='c'?'on':''}" data-a="mode" data-v="c">Flash cards</button><button class="cb ${s.mode==='q'?'on':''}" data-a="mode" data-v="q">Quiz</button></div>`;
  if(s.mode==='c'){
    h+=`<div class="peek"><div class="st">${esc(s.i)} / ${esc(s.n)}</div><div class="pk1">${esc(s.c)}</div><div class="pk2">${esc(s.m)}</div>${s.d?`<div class="st">${esc(s.d)}</div>`:''}</div>
<button class="cb big" data-a="flip">${s.fl?'Voltar à frente':'Virar carta'}</button>
<div class="row"><button class="cb" data-a="prev">‹ Anterior</button><button class="cb" data-a="next">Próxima ›</button></div>
<div class="row">${[['all','Tudo'],['p','Princípios'],['f','Formas']].map(([k,t])=>`<button class="cb ${s.filt===k?'on':''}" data-a="filt" data-v="${k}">${t}</button>`).join('')}</div>
<div class="row"><button class="cb ${s.rev?'on':''}" data-a="dir">${s.rev?'PT → CN':'CN → PT'}</button><button class="cb ${s.sh?'on':''}" data-a="shuf">Embaralhar</button></div>`;
  }else if(s.done){h+=`<div class="peek"><div class="pk2">Resultado: ${esc(s.score)} de ${esc(s.qn)}</div></div><button class="cb big" data-a="qreset">Jogar de novo</button>`}
  else{h+=`<div class="peek"><div class="st">Pergunta ${esc(s.qi+1)} de ${esc(s.qn)} (★ = resposta certa, só você vê)</div>${esc(s.q)}</div>`+(s.o||[]).map((t,k)=>`<button class="cb opt2 ${s.ans&&k===s.a?'ok':''}" data-a="pick" data-v="${k}" ${s.ans?'disabled':''}><b>${'ABC'[k]}</b> ${esc(t)}${!s.ans&&k===s.a?' ★':''}</button>`).join('')+`<button class="cb big" data-a="qnext" ${s.ans?'':'disabled'}>Próxima</button><button class="cb" data-a="qreset">Reiniciar quiz</button>`}
  el.innerHTML=h;
}
function connectCtl(){
  ctlCode=$('#ci').value.trim();const m=$('#cmsg');m.textContent='Conectando…';
  if(peer)peer.destroy();
  peer=new Peer();
  peer.on('open',()=>{
    connCtl=peer.connect('garra-'+ctlCode);
    connCtl.on('open',()=>{
      m.textContent='';
      try{localStorage.setItem('gcode2',ctlCode)}catch(e){}
      drawCtl();
    });
    connCtl.on('data',d=>{if(d.type==='st'){ST=d.st;drawCtl()}});
    connCtl.on('close',()=>{connCtl=null;ST=null;drawCtl()});
  });
  peer.on('error',()=>m.textContent='Não consegui conectar. Verifique o código.');
}
function startCtl(){
  clearInterval(tm);if(peer){peer.destroy();peer=null}
  ['#mCards','#mQuiz','#foot','nav','#rempanel'].forEach(q=>$(q).classList.add('hidden'));
  $('#mCtl').classList.remove('hidden');drawCtl();
}
$('#ctl').onclick=e=>{const b=e.target.closest('[data-a]');if(!b||!connCtl||b.disabled)return;
  const v=b.dataset.v;connCtl.send({type:'cmd',a:b.dataset.a,v:v==null?undefined:(isNaN(v)?v:+v)})};
$('#asctl').onclick=()=>{location.hash='controle';startCtl()};
if(location.hash==='#controle')startCtl();else startDisplay();
</script>
</body>
